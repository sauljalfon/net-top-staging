<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - Net-Top-Staging</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <h1>Net-Top-Staging</h1>
        <div>
            <a href="index.html">Dashboard</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>
    <nav class="nav">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="nodes.html">Nodes</a></li>
            <li><a href="racks.html">Racks</a></li>
            <li><a href="panels.html">Panels</a></li>
            <li><a href="devices.html">Devices</a></li>
            <li><a href="ports.html">Ports</a></li>
            <li><a href="connections.html" class="active">Connections</a></li>
            <li><a href="pathfinding.html">Pathfinding</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Create Connection</h2>
            <form id="createForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="filter_node_id">Filter by Node</label>
                        <select id="filter_node_id">
                            <option value="">All nodes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filter_parent_type">Parent Type</label>
                        <select id="filter_parent_type">
                            <option value="">All</option>
                            <option value="panel">Panel</option>
                            <option value="device">Device</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filter_parent_id">Panel/Device</label>
                        <select id="filter_parent_id">
                            <option value="">All</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="port_a_id">Port A</label>
                        <select id="port_a_id" required>
                            <option value="">Select port...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="port_b_id">Port B</label>
                        <select id="port_b_id" required>
                            <option value="">Select port...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <input type="text" id="notes" placeholder="Optional notes">
                </div>
                <button type="submit" class="btn btn-success">Create Connection</button>
            </form>
        </div>

        <div class="card">
            <h2>Connections</h2>
            <div id="list"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        checkAuth();
        let allPorts = [];
        let allNodes = [];
        let allPanels = [];
        let allDevices = [];

        async function loadPorts() {
            const [ports, nodes, panels, devices] = await Promise.all([
                apiGet('/ports'),
                apiGet('/nodes?site_id=1'),
                apiGet('/panels'),
                apiGet('/devices')
            ]);
            allPorts = ports;
            allNodes = nodes;
            allPanels = panels;
            allDevices = devices;

            document.getElementById('filter_node_id').innerHTML = '<option value="">All nodes</option>' +
                nodes.map(n => `<option value="${n.id}">${esc(n.name)}</option>`).join('');

            renderParentFilterOptions();
            renderPortSelects();
        }

        function renderParentFilterOptions() {
            const type = document.getElementById('filter_parent_type').value;
            const nodeId = parseInt(document.getElementById('filter_node_id').value);
            let options = [{ id: '', name: 'All' }];

            if (type === 'panel') {
                options = options.concat(allPanels
                    .filter(p => !nodeId || p.node_id === nodeId)
                    .map(p => ({ id: `panel:${p.id}`, name: p.name })));
            } else if (type === 'device') {
                options = options.concat(allDevices
                    .filter(d => !nodeId || d.node_id === nodeId)
                    .map(d => ({ id: `device:${d.id}`, name: d.name })));
            }

            document.getElementById('filter_parent_id').innerHTML = options
                .map(o => `<option value="${o.id}">${esc(o.name)}</option>`)
                .join('');
        }

        function getFilteredPorts() {
            const nodeId = parseInt(document.getElementById('filter_node_id').value);
            const type = document.getElementById('filter_parent_type').value;
            const parentRaw = document.getElementById('filter_parent_id').value;
            const nodePanels = new Set(allPanels.filter(p => !nodeId || p.node_id === nodeId).map(p => p.id));
            const nodeDevices = new Set(allDevices.filter(d => !nodeId || d.node_id === nodeId).map(d => d.id));

            return allPorts.filter(p => {
                if (nodeId) {
                    const panelOk = p.panel_id && nodePanels.has(p.panel_id);
                    const deviceOk = p.device_id && nodeDevices.has(p.device_id);
                    if (!panelOk && !deviceOk) return false;
                }

                if (!type) return true;
                if (type === 'panel' && !p.panel_id) return false;
                if (type === 'device' && !p.device_id) return false;
                if (!parentRaw) return true;

                const [parentType, idStr] = parentRaw.split(':');
                const parentId = parseInt(idStr);
                if (parentType === 'panel') return p.panel_id === parentId;
                if (parentType === 'device') return p.device_id === parentId;
                return true;
            });
        }

        function renderPortSelects() {
            const ports = getFilteredPorts();
            const panelMap = {}; allPanels.forEach(p => panelMap[p.id] = p.name);
            const deviceMap = {}; allDevices.forEach(d => deviceMap[d.id] = d.name);
            const makeOptions = (list) => list.map(p => {
                const owner = p.panel_id ? panelMap[p.panel_id] : deviceMap[p.device_id];
                const label = `${p.name} (${owner || '?'} - ${p.panel_id ? 'Panel' : 'Device'})`;
                return `<option value="${p.id}">${esc(label)}</option>`;
            }).join('');

            document.getElementById('port_a_id').innerHTML = '<option value="">Select port...</option>' + makeOptions(ports);
            document.getElementById('port_b_id').innerHTML = '<option value="">Select port...</option>' + makeOptions(ports);
        }

        async function loadConnections() {
            const connections = await apiGet('/connections');
            const list = document.getElementById('list');

            if (!connections.length) {
                list.innerHTML = '<p>No connections yet.</p>';
                return;
            }

            list.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Port A</th>
                            <th>Panel/Device A</th>
                            <th>Port B</th>
                            <th>Panel/Device B</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${connections.map(c => `
                            <tr>
                                <td>${esc(c.port_a_display_name || c.port_a_name)}</td>
                                <td>${esc(c.port_a_panel_name || c.port_a_device_name || '-')}</td>
                                <td>${esc(c.port_b_display_name || c.port_b_name)}</td>
                                <td>${esc(c.port_b_panel_name || c.port_b_device_name || '-')}</td>
                                <td><span class="badge badge-${c.status === 'active' ? 'active' : 'inactive'}">${esc(c.status)}</span></td>
                                <td><button class="btn btn-danger" onclick="deleteConnection(${c.id})">Delete</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function createConnection(e) {
            e.preventDefault();
            const portA = document.getElementById('port_a_id').value;
            const portB = document.getElementById('port_b_id').value;

            if (portA === portB) {
                showMessage('Cannot connect a port to itself', 'error');
                return;
            }

            try {
                await apiPost('/connections', {
                    port_a_id: parseInt(portA),
                    port_b_id: parseInt(portB),
                    notes: document.getElementById('notes').value || null
                });
                showMessage('Connection created');
                document.getElementById('createForm').reset();
                loadConnections();
                loadPorts();
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        async function deleteConnection(id) {
            if (!confirm('Delete this connection?')) return;
            try {
                await apiDelete(`/connections/${id}`);
                showMessage('Connection deleted');
                loadConnections();
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        function esc(s) {
            return (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        document.getElementById('createForm').addEventListener('submit', createConnection);
        document.getElementById('filter_node_id').addEventListener('change', () => {
            renderParentFilterOptions();
            renderPortSelects();
        });
        document.getElementById('filter_parent_type').addEventListener('change', () => {
            renderParentFilterOptions();
            renderPortSelects();
        });
        document.getElementById('filter_parent_id').addEventListener('change', renderPortSelects);
        loadPorts().then(loadConnections);
    </script>
</body>
</html>
